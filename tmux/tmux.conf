# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set-option -g focus-events on

set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-256color:RGB"

set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay
set -g history-limit 1000000 # increase history size (from 2,000)
set -g mouse on              # enable mouse support
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard
set -g status-interval 3     # update the status bar every 3 seconds

set -g status-left "#[fg=colour10,bold] #S"
set -g status-left-length 200
set -g status-position top
set -g status-right-length 160
set -g status-right '#[fg=white#,bg=purple]#{?window_zoomed_flag, Z ,}#($HOME/.local/bin/build-status)#($HOME/dotfiles/tmux/extensions/bin/home-size)#($HOME/dotfiles/tmux/extensions/bin/tmsave --auto)#[default,bold][P:#{window_panes}] #[fg=colour10,bold]  #[fg=colour51]#H#[fg=colour14]'
set -g status-style 'bg=default' # transparent

set -g window-status-current-format '#[fg=colour51]   #[fg=colour14]#W'
set -g window-status-format '#{?window_bell_flag,#[fg=yellow#,bold]  #W,  #[fg=gray]#W}'
set -g window-status-bell-style 'fg=yellow,bold,bg=default' # highlight windows that rang the bell
set -g visual-bell off # no "Bell in window" message; tmux-bell-notify says which window instead
set -ga terminal-overrides ',*:bel@' # never pass the bell to Alacritty (no generic GNOME alert); tmux still flags the window
# desktop notification saying which session:window rang the bell
set-hook -g alert-bell 'run-shell -b "$HOME/dotfiles/tmux/extensions/bin/tmux-bell-notify #{q:session_name} #{window_index} #{q:window_name} #{window_active}"'
set -g message-command-style 'bg=default,fg=yellow'
set -g message-style 'bg=default,fg=yellow'
set -g mode-style 'bg=default,fg=yellow'
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g status-keys vi
set -g mode-keys vi
# copy mode (prefix+[): v select, C-v block, y copy to clipboard, like vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# reload source file
bind-key R source-file ~/.config/tmux/tmux.conf \; display "Reloaded .tmux.config"

# Docker infrastructure manager
bind-key I new-window -n infra "$HOME/dotfiles/tmux/extensions/bin/infra"

# Directory and Git worktree pickers
bind-key F display-popup -E -w 80% -h 75% \
  "$HOME/dotfiles/tmux/extensions/bin/tmopen"
bind-key G display-popup -E -w 80% -h 75% \
  "$HOME/dotfiles/tmux/extensions/bin/tmopen --git"
bind-key g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" lazygit
bind-key P display-popup -E -w 90% -h 80% \
  "$HOME/dotfiles/tmux/extensions/bin/azpr"

bind-key s display-popup -E -w 80% -h 75% \
  "tmux list-sessions -F '#{session_name}' \
    | fzf --reverse --border \
          --prompt='Sessions > ' \
          --preview='tmux capture-pane -pt {}' \
          --preview-window='right:60%' \
    | xargs -r -I {} tmux switch-client -t '{}'"


# Session snapshots: auto-saved every 5 min (status bar above), restored when the server starts
# not -b: finish before the session tmux was started for (e.g. by tmh) is created, or that session is skipped
run-shell "$HOME/dotfiles/tmux/extensions/bin/tmrestore --startup"
bind-key C-s run-shell -b "$HOME/dotfiles/tmux/extensions/bin/tmsave && tmux display 'Sessions saved'"
bind-key C-r run-shell -b "$HOME/dotfiles/tmux/extensions/bin/tmrestore && tmux display 'Sessions restored'"

# Telescope-style window picker
bind-key w display-popup -E -w 80% -h 75% \
  "$HOME/dotfiles/tmux/extensions/bin/tmwin"

